name: media.local and the iPoDS 3DS host
# The ipo-ds branch's own additions: the media.local contract, its sim host,
# the 3DS host's C units compiled for the build machine under ASan and UBSan,
# the 3DS build arguments, and the sim bundle the iPoDS tests boot. Runs on
# every pull request so an upstream sync is checked against them.
on:
  pull_request:
  push:
    branches: [ipo-ds]
permissions:
  contents: read
jobs:
  localmedia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # tools/wasm.ts builds on the toolchain rust-toolchain.toml pins, so the wasm target goes there.
      - name: Read fixed Rust toolchain
        id: rust-pin
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/web/wasm
      - run: bun tools/wasm.ts
      - run: bun test tests/localmedia.test.ts tests/localmedia-sim.test.ts tests/localmedia-native.test.ts tests/3ds-arguments.test.ts
      - run: bun tools/build.ts cafe-main
      - run: bun test --conditions=browser tests/sim-bundle.test.ts
